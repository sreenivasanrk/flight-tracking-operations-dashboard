<div class="empty-state-container flex flex-column align-items-center justify-content-center text-center p-5">
  <div class="radar-scope-graphic mb-4 flex align-items-center justify-content-center">
    <div class="radar-ring ring-1"></div>
    <div class="radar-ring ring-2"></div>
    <div class="radar-sweep"></div>
    <fa-icon [icon]="faPlane" class="radar-center-icon text-2xl"></fa-icon>
  </div>

  <h3 class="text-xl font-bold text-primary m-0 mb-2">{{ title }}</h3>
  <p class="text-sm text-muted m-0 mb-4 line-height-3 max-w-25rem">
    {{ message }}
  </p>

  @if (actionLabel) {
    <p-button 
      [outlined]="true"
      severity="info"
      (onClick)="actionClick.emit()">
      <ng-template #default>
        <div class="flex align-items-center gap-2">
          <fa-icon [icon]="faCompass"></fa-icon>
          <span>{{ actionLabel }}</span>
        </div>
      </ng-template>
    </p-button>
  }
</div>
