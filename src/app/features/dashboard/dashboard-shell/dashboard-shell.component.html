<div class="dashboard-shell flex flex-column h-screen w-screen overflow-hidden">
  <!-- Top Aviation Operations Header / Toolbar -->
  <header class="ops-header px-3 py-2 border-bottom-1 border-subtle flex justify-content-between align-items-center flex-wrap gap-2">
    <!-- Logo & Center Identification -->
    <div class="flex align-items-center gap-3">
      <div class="ops-logo-badge flex align-items-center justify-content-center">
        <svg class="w-1-5rem h-1-5rem text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
        </svg>
      </div>
      <div>
        <div class="flex align-items-center gap-2">
          <h1 class="text-base lg:text-lg font-bold font-mono tracking-tight text-primary m-0">AEROTRACK OPS</h1>
          <span class="ops-status-pill text-xs font-mono font-bold text-emerald-400 bg-emerald-950 px-2 py-0 border-round">
            LIVE
          </span>
        </div>
        <span class="text-xs text-muted block hidden sm:block">Global Flight Operations & Telemetry Center</span>
      </div>
    </div>

    <!-- Center Status & UTC Clock -->
    <div class="hidden md:flex align-items-center gap-3 glass-panel px-3 py-1 border-round-lg font-mono">
      <div class="flex align-items-center gap-2 text-xs">
        <i class="pi pi-clock text-sky-400"></i>
        <span class="text-muted">UTC:</span>
        <strong class="text-primary">{{ currentUtcTime() | date:'HH:mm:ss' }}Z</strong>
      </div>
      <span class="text-muted">|</span>
      <div class="flex align-items-center gap-2 text-xs">
        <i class="pi pi-shield text-emerald-400"></i>
        <span class="text-muted">System:</span>
        <span class="text-emerald-400 font-bold">NOMINAL</span>
      </div>
    </div>

    <!-- Right Action Controls -->
    <div class="flex align-items-center gap-2">
      <!-- Simulation Play/Pause Button -->
      <p-button
        [icon]="(isSimulationRunning$ | async) ? 'pi pi-pause' : 'pi pi-play'"
        [label]="(isSimulationRunning$ | async) ? 'Pause Sim' : 'Live Sim'"
        [severity]="(isSimulationRunning$ | async) ? 'success' : 'secondary'"
        size="small"
        [outlined]="true"
        (onClick)="toggleSimulation()"
        pTooltip="Toggle real-time flight position playback simulation"
        tooltipPosition="bottom">
      </p-button>

      <!-- Simulation Speed Selector -->
      <p-button
        [label]="(simulationSpeed$ | async) + 'x'"
        severity="secondary"
        size="small"
        [outlined]="true"
        (onClick)="cycleSimulationSpeed()"
        pTooltip="Change simulation playback speed"
        tooltipPosition="bottom">
      </p-button>

      <!-- Light / Dark Mode Toggle -->
      <p-button
        [rounded]="true"
        severity="secondary"
        size="small"
        (onClick)="toggleTheme()"
        [pTooltip]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        tooltipPosition="bottom"
        aria-label="Toggle dark/light theme">
        <fa-icon [icon]="isDarkMode() ? faSun : faMoon"></fa-icon>
      </p-button>

      <!-- Tablet / Mobile Drawer Toggle Button (Visible on screens < 1024px) -->
      <p-button
        icon="pi pi-bars"
        severity="info"
        size="small"
        styleClass="lg:hidden"
        (onClick)="drawerVisible.set(true)"
        pTooltip="Open Flights & Details Panel"
        tooltipPosition="bottom"
        aria-label="Toggle flights side panel drawer">
      </p-button>
    </div>
  </header>

  <!-- Operations Top KPI Metric Bar -->
  <section class="kpi-section px-3 py-2 border-bottom-1 border-subtle" aria-label="Operations Overview KPIs">
    <app-kpi-bar></app-kpi-bar>
  </section>

  <!-- Main Workspace: Splitter on Desktop / Map + Drawer on Mobile -->
  <main class="dashboard-main flex-1 p-2 overflow-hidden">
    <!-- Desktop Splitter Layout -->
    <div class="hidden lg:block h-full">
      <p-splitter 
        [panelSizes]="[65, 35]" 
        [minSizes]="[45, 25]" 
        styleClass="h-full border-none bg-transparent"
        (onResizeEnd)="onSplitterResize($event)">
        <!-- Left Panel: Centerpiece Leaflet Map -->
        <ng-template #panel>
          <div class="h-full pr-2">
            <app-flight-map #desktopMap></app-flight-map>
          </div>
        </ng-template>

        <!-- Right Panel: Docked Tabbed Panel (Flights List & Flight Details) -->
        <ng-template #panel>
          <div class="h-full pl-2 flex flex-column">
            <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" class="h-full flex flex-column">
              <p-tablist class="flex-shrink-0 mb-2">
                <p-tab value="list" class="font-mono text-xs font-bold">
                  <i class="pi pi-list mr-1"></i> Fleet List ({{ (filteredFlights$ | async)?.length || 0 }})
                </p-tab>
                <p-tab value="details" class="font-mono text-xs font-bold">
                  <i class="pi pi-info-circle mr-1"></i> Flight Details
                </p-tab>
              </p-tablist>

              <p-tabpanels class="flex-1 overflow-hidden p-0">
                <p-tabpanel value="list" class="h-full p-0">
                  <app-flight-list-panel></app-flight-list-panel>
                </p-tabpanel>
                <p-tabpanel value="details" class="h-full p-0">
                  <app-flight-details-panel></app-flight-details-panel>
                </p-tabpanel>
              </p-tabpanels>
            </p-tabs>
          </div>
        </ng-template>
      </p-splitter>
    </div>

    <!-- Mobile / Tablet Single View (Map Centerpiece) -->
    <div class="block lg:hidden h-full">
      <app-flight-map #mobileMap></app-flight-map>
    </div>

    <!-- Responsive Tablet / Mobile Drawer -->
    <p-drawer
      [visible]="drawerVisible()"
      (visibleChange)="drawerVisible.set($event)"
      position="right"
      [style]="{ width: '90vw', maxWidth: '480px' }"
      header="Operations Fleet Panel">
      <div class="h-full flex flex-column">
        <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" class="h-full flex flex-column">
          <p-tablist class="flex-shrink-0 mb-2">
            <p-tab value="list" class="font-mono text-xs font-bold">
              <i class="pi pi-list mr-1"></i> Fleet ({{ (filteredFlights$ | async)?.length || 0 }})
            </p-tab>
            <p-tab value="details" class="font-mono text-xs font-bold">
              <i class="pi pi-info-circle mr-1"></i> Details
            </p-tab>
          </p-tablist>

          <p-tabpanels class="flex-1 overflow-hidden p-0">
            <p-tabpanel value="list" class="h-full p-0">
              <app-flight-list-panel></app-flight-list-panel>
            </p-tabpanel>
            <p-tabpanel value="details" class="h-full p-0">
              <app-flight-details-panel></app-flight-details-panel>
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>
      </div>
    </p-drawer>
  </main>
</div>
